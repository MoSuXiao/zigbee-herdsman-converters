name: Requires external review

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: write

jobs:
  requires-external-review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check for files that require external review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Checking PR #$PR_NUMBER"

          # ---------------------------------------------------------
          # 1. Skip if PR already has the approval label
          # ---------------------------------------------------------

          LABELS=$(gh pr view "$PR_NUMBER" \
            --json labels \
            --jq '.labels[].name')

          for label in $LABELS; do
            if [[ "$label" == "external-reviewer-approved" ]]; then
              echo "::notice::PR already has the 'external-reviewer-approved' label."
              exit 0
            fi
          done

          # ---------------------------------------------------------
          # 2. Get PR author
          # ---------------------------------------------------------

          PR_AUTHOR=$(gh pr view "$PR_NUMBER" \
            --json author \
            --jq '.author.login')

          echo "PR author: @$PR_AUTHOR"

          # ---------------------------------------------------------
          # 3. Build reviewer map from CODEOWNERS
          # ---------------------------------------------------------

          declare -a PATTERNS=()
          declare -A PATTERN_REVIEWERS=()

          while IFS= read -r line; do
            line="${line%%#*}"
            [[ -z "${line// }" ]] && continue

            read -r pattern owners <<< "$line"

            PATTERNS+=("$pattern")
            PATTERN_REVIEWERS["$pattern"]="$owners"
          done < CODEOWNERS

          # ---------------------------------------------------------
          # 4. Get changed files
          # ---------------------------------------------------------

          CHANGED_FILES=$(gh pr view "$PR_NUMBER" \
            --json files \
            --jq '.files[].path')

          MATCH=false
          declare -A MATCHED_REVIEWERS=()

          shopt -s extglob

          for file in $CHANGED_FILES; do
            for pattern in "${PATTERNS[@]}"; do

              # CODEOWNERS patterns:
              # leading "/" anchors to repository root.
              glob="$pattern"
              [[ "$glob" == /* ]] && glob="${glob:1}"

              if [[ $file == $glob ]]; then
                reviewers="${PATTERN_REVIEWERS[$pattern]}"

                # -------------------------------------------------
                # PR author is a CODEOWNER.
                # No external review required.
                # -------------------------------------------------

                IS_OWNER=false

                for owner in $reviewers; do
                  owner_clean="${owner#@}"

                  if [[ "$owner_clean" == "$PR_AUTHOR" ]]; then
                    IS_OWNER=true

                    echo "::notice::Skipping '$file' — PR author @$PR_AUTHOR is a code owner"

                    break
                  fi
                done

                $IS_OWNER && continue

                echo "::error::Review required for '$file' by '$reviewers'"

                MATCHED_REVIEWERS["$reviewers"]+="$file"$'\n'
                MATCH=true
              fi
            done
          done

          # ---------------------------------------------------------
          # 5. No external review required
          # ---------------------------------------------------------

          if [ "$MATCH" = false ]; then
            echo "No files requiring external review were modified."
            exit 0
          fi

          # ---------------------------------------------------------
          # 6. Check CODEOWNER approvals
          #
          # Any matching CODEOWNER approval is sufficient.
          # ---------------------------------------------------------

          REVIEWS=$(gh pr view "$PR_NUMBER" --json reviews)

          APPROVED=false
          APPROVED_BY=""

          for reviewers in "${!MATCHED_REVIEWERS[@]}"; do
            for owner in $reviewers; do
              owner_clean="${owner#@}"

              STATE=$(echo "$REVIEWS" | jq -r --arg owner "$owner_clean" '
                [
                  .reviews[]
                  | select(.author.login == $owner)
                  | .state
                ]
                | last // "NONE"
              ')

              if [[ "$STATE" == "APPROVED" ]]; then
                APPROVED=true
                APPROVED_BY="$owner_clean"

                echo "::notice::PR approved by code owner @$owner_clean"

                break 2
              fi
            done
          done

          # ---------------------------------------------------------
          # 7. CODEOWNER approval found
          # ---------------------------------------------------------

          if [ "$APPROVED" = true ]; then
            echo "External review requirement satisfied by @$APPROVED_BY."
            exit 0
          fi

          # ---------------------------------------------------------
          # 8. No CODEOWNER approval
          # ---------------------------------------------------------

          echo "::error::No required CODEOWNER has approved this PR."

          # ---------------------------------------------------------
          # 9. Post comment only once
          # ---------------------------------------------------------

          MARKER="<!-- requires-external-review -->"

          EXISTING=$(gh pr view "$PR_NUMBER" \
            --json comments \
            --jq ".comments[].body | select(contains(\"$MARKER\"))" \
            || true)

          if [ -z "$EXISTING" ]; then
            BODY="$MARKER"$'\n'
            BODY+="## External review required"$'\n\n'
            BODY+="This PR modifies files that require review from their code owners before merging."$'\n\n'

            for reviewers in "${!MATCHED_REVIEWERS[@]}"; do
              FILES="${MATCHED_REVIEWERS[$reviewers]}"

              BODY+="**$reviewers**:"$'\n'

              while IFS= read -r f; do
                [[ -n "$f" ]] && BODY+="- \`$f\`"$'\n'
              done <<< "$FILES"

              BODY+=$'\n'
            done

            BODY+="Once reviewed, add the \`external-reviewer-approved\` label or have one of the code owners approve this PR."

            gh pr comment "$PR_NUMBER" \
              --body "$BODY" \
              || echo "::warning::Could not post PR comment."
          fi

          exit 1
